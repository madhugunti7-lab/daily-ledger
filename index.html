<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger Entry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4 mb-5" style="max-width: 600px;">
  
  <!-- Form Card -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">New Transaction</h5>
    </div>
    <div class="card-body">
      <form id="ledgerForm">
        <div class="mb-3">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" id="txDate" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" id="type" required>
              <option value="Expense">Expense</option>
              <option value="Income">Income</option>
              <option value="Transfer">Transfer</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Category</label>
            <input type="text" class="form-control" id="category" placeholder="e.g. Utilities, Salary" required>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Amount (₹)</label>
            <input type="number" step="0.01" class="form-control" id="amount" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Payment Mode</label>
            <select class="form-select" id="mode">
              <option value="UPI">UPI</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Cash">Cash</option>
            </select>
          </div>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="taxFlag" value="Yes">
          <label class="form-check-label text-danger" for="taxFlag">Tax Deductible / Audit Required</label>
        </div>
        <div class="mb-3">
          <label class="form-label">Upload Receipt (Optional)</label>
          <input class="form-control" type="file" id="receiptFile">
        </div>
        <div class="mb-3">
          <label class="form-label">Notes</label>
          <textarea class="form-control" id="notes" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label text-danger fw-bold">Security PIN</label>
          <input type="password" class="form-control" id="pin" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="submitBtn">Submit Entry</button>
        <div id="statusMessage" class="mt-3 text-center"></div>
      </form>
    </div>
  </div>

  <!-- Recent Entries Card -->
  <div class="card shadow-sm">
    <div class="card-header bg-secondary text-white">
      <h6 class="mb-0">Recent Entries</h6>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0 text-center" style="font-size: 0.9rem;">
          <thead>
            <tr>
              <th>Date</th>
              <th>In/Out</th>
              <th>UPI/Cash/Card</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="recentTableBody">
            <tr><td colspan="4" class="text-muted">Loading recent entries...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  // YOUR APPS SCRIPT WEB APP URL
  const scriptURL = 'https://script.google.com/macros/s/AKfycby7cIqhwxnq_JvhESHF4WmeuO1hsLAc-DUQm80TXb7D52xPNHPhVbsGtQJRFXImuF2E/exec'; 

  // Function to load the last 5 entries from the sheet
  async function loadRecentEntries() {
    const tableBody = document.getElementById('recentTableBody');
    try {
      const response = await fetch(scriptURL, { redirect: "follow" });
      const result = await response.json();
      
      if (result.status === "success") {
        tableBody.innerHTML = ""; // Clear loading text
        if(result.data.length === 0) {
           tableBody.innerHTML = `<tr><td colspan="4" class="text-muted">No entries yet.</td></tr>`;
           return;
        }
        
        result.data.forEach(entry => {
          // Color code 'In' as green and 'Out' as red
          let typeColor = entry.type === "In" ? "text-success fw-bold" : (entry.type === "Out" ? "text-danger fw-bold" : "");
          let row = `<tr>
            <td>${entry.date}</td>
            <td class="${typeColor}">${entry.type}</td>
            <td>${entry.mode}</td>
            <td class="fw-bold">₹${entry.amount}</td>
          </tr>`;
          tableBody.innerHTML += row;
        });
      }
    } catch (error) {
      tableBody.innerHTML = `<tr><td colspan="4" class="text-danger">Failed to load entries.</td></tr>`;
    }
  }

  // Load entries immediately when the page opens
  loadRecentEntries();

  // Form Submission Logic
  document.getElementById('ledgerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('statusMessage');
    const fileInput = document.getElementById('receiptFile');
    
    btn.disabled = true;
    btn.innerText = "Uploading...";
    status.innerText = "";

    let payload = {
      txDate: document.getElementById('txDate').value,
      type: document.getElementById('type').value,
      category: document.getElementById('category').value,
      amount: document.getElementById('amount').value,
      mode: document.getElementById('mode').value,
      taxFlag: document.getElementById('taxFlag').checked ? "Yes" : "No",
      notes: document.getElementById('notes').value,
      pin: document.getElementById('pin').value, 
      fileBase64: "",
      fileName: "",
      fileType: ""
    };

    const getBase64 = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]); 
        reader.onerror = error => reject(error);
      });
    };

    try {
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        payload.fileName = file.name;
        payload.fileType = file.type;
        payload.fileBase64 = await getBase64(file);
      }

      const response = await fetch(scriptURL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: "follow" 
      });

      const result = await response.json();

      if (result.status === "success") {
        status.innerHTML = `<span class="text-success fw-bold">Entry recorded successfully!</span>`;
        document.getElementById('ledgerForm').reset();
        
        // Refresh the recent entries table after a successful submission
        loadRecentEntries();
        
      } else {
        throw new Error(result.message);
      }
    } catch (error) {
      status.innerHTML = `<span class="text-danger fw-bold">Error: ${error.message}</span>`;
    } finally {
      btn.disabled = false;
      btn.innerText = "Submit Entry";
    }
  });
</script>
</body>
</html>
