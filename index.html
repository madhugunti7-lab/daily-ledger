<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger Entry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4 mb-5" style="max-width: 600px;">
  
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">New Transaction</h5>
    </div>
    <div class="card-body">
      <form id="ledgerForm">
        
        <div class="mb-3">
          <label class="form-label">Date</label>
          <input type="date" class="form-control" id="txDate" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Type</label>
          <select class="form-select" id="type" required>
            <option value="Expense">Expense</option>
            <option value="Income">Income</option>
            <option value="Transfer">Transfer</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Amount (₹)</label>
          <input type="number" step="0.01" class="form-control" id="amount" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Payment Mode</label>
          <select class="form-select" id="mode">
            <option value="UPI">UPI</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Cash">Cash</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label text-danger fw-bold">Security PIN</label>
          <input type="password" class="form-control" id="pin" required>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="submitBtn">Submit Entry</button>
        <div id="statusMessage" class="mt-3 text-center"></div>
      </form>
    </div>
  </div>

</div>

<script>
  // YOUR APPS SCRIPT WEB APP URL
  const scriptURL = 'https://script.google.com/macros/s/AKfycby7cIqhwxnq_JvhESHF4WmeuO1hsLAc-DUQm80TXb7D52xPNHPhVbsGtQJRFXImuF2E/exec'; 

  document.getElementById('ledgerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const status = document.getElementById('statusMessage');
    
    // Compile the strict 5-field payload
    let payload = {
      txDate: document.getElementById('txDate').value,
      type: document.getElementById('type').value,
      amount: document.getElementById('amount').value,
      mode: document.getElementById('mode').value,
      pin: document.getElementById('pin').value
    };

    // 1. Instant User Feedback: Clear form immediately so you don't have to wait
    status.innerHTML = `<span class="text-primary fw-bold">Syncing in background...</span>`;
    document.getElementById('ledgerForm').reset();
    
    // 2. Fire-and-forget: Send data to Google without freezing the page
    fetch(scriptURL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
      redirect: "follow" 
    })
    .then(response => response.json())
    .then(result => {
      if (result.status === "success") {
        status.innerHTML = `<span class="text-success fw-bold">Entry recorded successfully!</span>`;
        // Optional: clear the success message after 3 seconds for a clean slate
        setTimeout(() => status.innerHTML = "", 3000); 
      } else {
        status.innerHTML = `<span class="text-danger fw-bold">Error: ${result.message}</span>`;
      }
    })
    .catch(error => {
      status.innerHTML = `<span class="text-danger fw-bold">Network error. Please check your connection.</span>`;
    });
  });
</script>
</body>
</html>
